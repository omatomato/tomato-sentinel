[project]
name = "tomato-sentinel-workspace"
version = "0.0.0"
description = "Backend workspace for Tomato Sentinel"
requires-python = ">=3.13,<3.15"
dependencies = [
  "jsonschema==4.26.0",
]

[dependency-groups]
dev = [
  "mypy==2.3.0",
  "pytest==9.1.1",
  "ruff==0.15.22",
  "types-jsonschema==4.26.0.20260518",
]

[tool.uv]
package = false
required-version = "==0.11.29"

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers"]
pythonpath = ["packages/policy-engine/src", "services/orchestrator/src"]
testpaths = ["packages", "services", "tests"]

[tool.mypy]
python_version = "3.13"
strict = true
files = [
  "packages/policy-engine/src",
  "packages/policy-engine/tests",
  "services/orchestrator/src",
  "services/orchestrator/tests",
]
warn_unreachable = true

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = ["docs/product/product-specification-original.md"]

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
